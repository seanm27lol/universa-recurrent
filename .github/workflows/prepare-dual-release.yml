name: Validate dual-output release
"on":
  push:
    branches: [staging/dual-output-0.5.0]
permissions:
  contents: write
concurrency:
  group: dual-output-release-0.5.0
  cancel-in-progress: false
jobs:
  source-and-tests:
    if: github.repository == 'seanm27lol/universa-recurrent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ae6201e78fc3c4a02e6445e8b44a1979e2a61e91
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reconstruct reviewed source on exact base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dual-source"
          cp _dual_release/* "$RUNNER_TEMP/dual-source/"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git checkout --detach "$BASE"
          python "$RUNNER_TEMP/dual-source/prepare.py" "$RUNNER_TEMP/dual-source"
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'setuptools>=68' wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          python -m pip install -e '.[test]'
      - name: Test actual release source and installed wheel
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/check_release.py
          python scripts/check_wheel.py
      - name: Publish tested source to release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/dual-source/verified-tree")"
          git diff --exit-code
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test -z "$(git diff --cached --name-only -- .github _dual_release)"
          git config user.name 'universa-recurrent release audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Separate numerical estimates from structural claims; add matched-output study 0.5.0'
          git push origin HEAD:refs/heads/release/dual-output-0.5.0
          echo "Tested source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
