name: Tests
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m universa_recurrent.cli demo --trace full --output runs/ci.json
      - run: python -m universa_recurrent.cli verify runs/ci.json

  neural-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install patched CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<3"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_neural.py tests/test_neural_cli.py
      - name: Tiny neural smoke run
        run: |
          python -m universa_recurrent.cli neural-train \
            --device cpu --train-size 64 --val-size 32 --epochs 1 \
            --batch-size 32 --hidden-dim 16 --steps 2 \
            --output /tmp/neural-ci.pt
          python -m universa_recurrent.cli neural-demo \
            --device cpu --checkpoint /tmp/neural-ci.pt \
            --max-steps 2 --fixed --output /tmp/neural-ci.json
          python -m universa_recurrent.cli neural-verify /tmp/neural-ci.json \
            --checkpoint /tmp/neural-ci.pt

  optional-universa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test,universa]"
      - run: python -m pytest -q tests/test_upstream_adapter.py
