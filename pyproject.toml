[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universa-recurrent"
dynamic = ["version"]
description = "Readable multi-hypothesis structured recurrence with checkable mathematical records"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "universa-recurrent contributors"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "sqlglot==30.24.0"]  # sqlglot: the scaling study's CPU tests run in CI
universa = ["universa @ git+https://github.com/seanm27lol/Universa.git@132fdf8d5ebe87deb3d6cb597c8ab77407176918"]
neural = ["torch>=2.10,<3"]
# the TI-TNN scaling study (research/ti_tnn/scaling): SQL parsing for the relational IR and the scorer
scaling = ["sqlglot==30.24.0"]

[project.scripts]
universa-recurrent = "universa_recurrent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.dynamic]
version = {attr = "universa_recurrent.__version__"}
